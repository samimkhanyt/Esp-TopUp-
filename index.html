<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Sign-In</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 380px;
      width: 90%;
    }

    h2 {
      margin-bottom: 20px;
      color: #333;
    }

    /* Google Button Styling */
    .google-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #ffffff;
      color: #757575;
      border: 1px solid #dadce0;
      border-radius: 6px;
      padding: 10px 16px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s, box-shadow 0.2s;
    }

    .google-btn:hover {
      background-color: #f8f9fa;
      box-shadow: 0 1px 3px rgba(60,64,67,0.3);
    }

    .google-btn svg {
      width: 20px;
      height: 20px;
      margin-right: 12px;
    }

    /* User Profile Card Styling */
    .profile-card {
      display: none;
      flex-direction: column;
      align-items: center;
    }

    .profile-card img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin-bottom: 12px;
      border: 2px solid #4285f4;
    }

    .profile-card h3 {
      color: #222;
      font-size: 18px;
    }

    .profile-card p {
      color: #666;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .logout-btn {
      background-color: #ea4335;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.2s;
    }

    .logout-btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- Login State -->
    <div id="login-section">
      <h2>স্বাগতম</h2>
      <button class="google-btn" id="btn-google">
        <svg viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Google দিয়ে সাইন ইন করুন
      </button>
    </div>

    <!-- Logged In Profile State -->
    <div id="profile-section" class="profile-card">
      <img id="user-img" src="" alt="Profile Image">
      <h3 id="user-name"></h3>
      <p id="user-email"></p>
      <button class="logout-btn" id="btn-logout">লগআউট</button>
    </div>
  </div>

  <!-- Firebase Script (Version 10 Modular CDN) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      GoogleAuthProvider, 
      signInWithPopup, 
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyA3B7DZ_JeY-a33zdixKmZ6oQrU2iEVsEk",
      authDomain: "samim-firebase.firebaseapp.com",
      projectId: "samim-firebase",
      storageBucket: "samim-firebase.firebasestorage.app",
      messagingSenderId: "521003542655",
      appId: "1:521003542655:web:bbabcf2f24a0eaeeef774a",
      measurementId: "G-SPBMDSXJVX"
    };

    // Firebase Initialize
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    const loginSection = document.getElementById("login-section");
    const profileSection = document.getElementById("profile-section");
    const btnGoogle = document.getElementById("btn-google");
    const btnLogout = document.getElementById("btn-logout");
    const userName = document.getElementById("user-name");
    const userEmail = document.getElementById("user-email");
    const userImg = document.getElementById("user-img");

    // Google Sign-In Function
    btnGoogle.addEventListener("click", async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (error) {
        console.error("Login Error:", error.message);
        alert("লগইন করতে সমস্যা হয়েছে: " + error.message);
      }
    });

    // Logout Function
    btnLogout.addEventListener("click", async () => {
      try {
        await signOut(auth);
      } catch (error) {
        console.error("Logout Error:", error.message);
      }
    });

    // Check User State Change
    onAuthStateChanged(auth, (user) => {
      if (user) {
        // User logged in
        userName.innerText = user.displayName;
        userEmail.innerText = user.email;
        userImg.src = user.photoURL || "https://via.placeholder.com/80";
        
        loginSection.style.display = "none";
        profileSection.style.display = "flex";
      } else {
        // User logged out
        loginSection.style.display = "block";
        profileSection.style.display = "none";
      }
    });
  </script>
</body>
</html>
